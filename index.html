<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0066CC"/>
  <title>Safe Q-Web — 모바일 데모</title>
  <link rel="stylesheet" href="colors_and_type.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <!-- Apple tone override — 발표 슬라이드와 톤 일치. 복원하려면 이 줄만 제거. -->
  <link rel="stylesheet" href="apple-theme.css"/>
  <!-- Camera overlay — iOS 카메라 시연용. 복원하려면 이 줄만 제거. -->
  <link rel="stylesheet" href="camera-overlay.css"/>

  <!-- Leaflet for the map screen -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- 제휴 광고 (LinkPrice 미니샵) — 격리 iframe. 데모 폰 프레임 밖, 화면 우하단 고정. -->
  <aside class="affiliate-ad" aria-label="제휴 광고">
    <span class="affiliate-ad__label">AD</span>
    <iframe src="ad.html" width="120" height="60" frameborder="0" scrolling="no"
            title="제휴 광고" loading="lazy"
            sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-same-origin"></iframe>
  </aside>
  <style>
    .affiliate-ad {
      position: fixed; right: 16px; bottom: 16px; z-index: 9;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px; background: rgba(255,255,255,0.85); backdrop-filter: blur(6px);
      border: 1px solid rgba(0,0,0,0.08); border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }
    .affiliate-ad__label {
      font: 600 9px/1 -apple-system, system-ui, sans-serif;
      letter-spacing: 0.08em; color: #9a9a9f;
    }
    .affiliate-ad iframe { display: block; border: 0; }
    /* 모바일·좁은 화면: 광고가 폰 데모를 가리지 않게 더 작게/구석으로 */
    @media (max-width: 640px) {
      .affiliate-ad { right: 8px; bottom: 8px; transform: scale(0.9); transform-origin: bottom right; }
    }
  </style>

  <!-- Mock data first (plain JS) -->
  <script src="mock-data.js"></script>

  <!-- React app (JSX, in order — earlier files attach to window for later ones) -->
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="screen-login.jsx"></script>
  <script type="text/babel" src="screen-home.jsx"></script>
  <script type="text/babel" src="screen-scan.jsx"></script>
  <script type="text/babel" src="screen-map.jsx"></script>
  <script type="text/babel" src="screen-camera.jsx"></script>
  <script type="text/babel" src="screen-profile.jsx"></script>
  <script type="text/babel" src="screen-news.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
